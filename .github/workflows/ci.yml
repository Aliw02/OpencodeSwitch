name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Unit tests
        run: pytest -q

      - name: Console script resolves
        run: ops --version

      - name: Smoke - empty store
        run: ops account list

      - name: Smoke - switch with no accounts must fail cleanly
        run: ops switch nobody
        continue-on-error: true

      - name: Smoke - a real key validates with zero tokens
        env:
          OPS_SMOKE_KEY: ${{ secrets.ZEN_SMOKE_KEY }}
        run: |
          python -c "import os,sys; from ops import zen; \
          k=os.environ.get('OPS_SMOKE_KEY'); \
          sys.exit(0 if not k else (0 if zen.check(k).authenticates else 1))"
        continue-on-error: true
